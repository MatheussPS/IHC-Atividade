<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <title>Cadastro</title>
</head>

<body>
    <header class="header">
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <div class="header-content">
        <div class="logo-nav">
          <p class="logo-text"><a href="index.html">HABIT</a></p>
          <nav>
            <ul class="nav-ul nav-ul-d">
              <li><a href="index.html">Início</a></li>
              <li><a href="categorias.html">Páginas</a></li>
              <li><a href="destaques.html">Destaques</a></li>
              <li><a href="newsletter.html">Assinar</a></li>
              <li><a href="admin-categoria.html">Admin</a></li>
            </ul>
          </nav>
        </div>
        <div class="actions-container">
          <form>
            <input id="search-input" type="text" class="header-search-input" placeholder="Buscar..." aria-label="Buscar" />
          </form>
          <button class="header-btn search-btn" onclick="location.href='results.html'">Buscar</button>
          <button class="header-btn login-btn" onclick="location.href='login.html'">Entrar</button>
        </div>
        <label for="menu-toggle" class="menu-btn">
          <img class="hambuguer-img" src="img/hamburguer.png" alt="Abrir menu" />
        </label>
      </div>
      <div class="nav-mobile">
        <nav>
          <ul class="nav-ul-mobile nav-ul">
            <li><a href="index.html">Início</a></li>
            <li><a href="categorias.html">Páginas</a></li>
            <li><a href="destaques.html">Destaques</a></li>
            <li><a href="newsletter.html">Assinar</a></li>
            <li><a href="admin-categoria.html">Admin</a></li>
          </ul>
        </nav>
        <div class="actions-container-mobile">
          <form>
            <input type="text" class="header-search-input-mobile" placeholder="Buscar..." aria-label="Buscar" />
          </form>
          <div class="login-search-container-mobile">
            <button class="header-btn-mobile search-btn" onclick="location.href='results.html'">Buscar</button>
            <button class="header-btn-mobile login-btn" onclick="location.href='login.html'">Entrar</button>
          </div>
        </div>
      </div>
    </header>

    <main>
        <div class="contender-cadastro">
            <h2>Criar Conta</h2>
            <div class="conteudo-cadastro">
                <div class="field-group">
                    <label for="input-name">Nome Completo</label>
                    <input type="text" placeholder="João Silva" id="input-name">
                </div>
                <div class="field-group">
                    <label for="input-email">E-mail</label>
                    <input type="email" placeholder="seu@email.com" id="input-email">
                </div>
                <div class="field-group">
                    <label for="input-senha">Senha</label>
                    <input type="password" placeholder="••••••••" id="input-senha">
                </div>
                <div class="field-group">
                    <label for="input-confirmar-senha">Confirmar Senha</label>
                    <input type="password" placeholder="••••••••" id="input-confirmar-senha">
                </div>
                <div>
                    <input type="checkbox" name="checkbox" id="checkbox">
                    <label for="checkbox">Concordo com os termos e condições.</label>
                </div>
                <input type="button" value="Cadastrar" id="button-cadastrar" onclick="location.href='login.html'">
            </div>
        </div>
    </main>
    <footer>
        <nav class="botoes-footer" aria-label="Links do rodapé">
            <a href="#" class="button-footer"><b>Instagram</b></a>
            <a href="#" class="button-footer"><b>Work</b></a>
            <a href="#" class="button-footer"><b>Bags</b></a>
            <a href="#" class="button-footer"><b>Lamp</b></a>
            <a href="#" class="button-footer"><b>Books</b></a>
        </nav>
        <br>
        <p>© 2025 Meu Site • Meu site</p>
    </footer>
</body>
</html>
