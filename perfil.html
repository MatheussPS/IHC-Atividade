<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="css/perfil.css">
    <title>Perfil</title>
</head>

<body>

    <header class="header">
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <div class="header-content">
        <div class="logo-nav">
          <p class="logo-text"><a href="/">HABIT</a></p>
          <nav>
            <ul class="nav-ul nav-ul-d">
              <li><a href="index.html">Início</a></li>
              <li><a href="categorias.html">Páginas</a></li>
              <li><a href="destaques.html">Destaques</a></li>
              <li><a href="newsletter.html">Assinar</a></li>
              <li><a href="admin-categoria.html">Admin</a></li>
            </ul>
          </nav>
        </div>
        <div class="actions-container">
          <form>
            <input id="search-input" type="text" class="header-search-input" placeholder="Buscar..." aria-label="Buscar" />
          </form>
          <button class="header-btn search-btn" onclick="location.href='results.html'">Buscar</button>
          <button class="header-btn login-btn" onclick="location.href='login.html'">Entrar</button>
        </div>
        <label for="menu-toggle" class="menu-btn">
          <img class="hambuguer-img" src="img/hamburguer.png" alt="Abrir menu" />
        </label>
      </div>
      <div class="nav-mobile">
        <nav>
          <ul class="nav-ul-mobile nav-ul">
            <li><a href="index.html">Início</a></li>
            <li><a href="categorias.html">Páginas</a></li>
            <li><a href="destaques.html">Destaques</a></li>
            <li><a href="newsletter.html">Assinar</a></li>
            <li><a href="admin-categoria.html">Admin</a></li>
          </ul>
        </nav>
        <div class="actions-container-mobile">
          <form>
            <input type="text" class="header-search-input-mobile" placeholder="Buscar..." aria-label="Buscar" />
          </form>
          <div class="login-search-container-mobile">
            <button class="header-btn-mobile search-btn" onclick="location.href='results.html'">Buscar</button>
            <button class="header-btn-mobile login-btn" onclick="location.href='login.html'">Entrar</button>
          </div>
        </div>
      </div>
    </header>

    <main class="perfil-container">
    <section class="perfil-section">
        <h2>Perfil</h2>
        <div class="perfil-box">
            <div class="perfil-foto"></div>
            <input type="text" placeholder="Nome" class="perfil-input">
            <input type="text" placeholder="Bio" class="perfil-input"> <!-- Bio igual ao Nome -->
            <button class="perfil-salvar">Salvar</button>
        </div>
    </section>

    <section class="postagens-section">
        <h2>Suas Postagens</h2>
        <div class="postagens-box">
            <div class="post">
                <div class="post-img"></div>
                <div class="post-text">
                    <span class="status">Rascunho</span>
                    <span class="titulo">Post 1</span>
                </div>
            </div>
            <div class="post">
                <div class="post-img"></div>
                <div class="post-text">
                    <span class="status">Publicado</span>
                    <span class="titulo">Post 2</span>
                </div>
            </div>
            <div class="post">
                <div class="post-img"></div>
                <div class="post-text">
                    <span class="status">Em análise</span>
                    <span class="titulo">Comentário 1</span>
                </div>
            </div>
            <div class="post">
                <div class="post-img"></div>
                <div class="post-text">
                    <span class="status">Publicado</span>
                    <span class="titulo">Comentário 2</span>
                </div>
            </div>
        </div>
    </section>
</main>

    <footer>
        <div class="botoes-footer">
            <button class="button-footer"><b>Instagram</b></button>
            <button class="button-footer"><b>Work</b></button>
            <button class="button-footer"><b>Bags</b></button>
            <button class="button-footer"><b>Lamp</b></button>
            <button class="button-footer"><b>Books</b></button>
        </div>
        <br>
        <p>© 2025 Meu Site • Meu site</p>
    </footer>
</body>
</html>
