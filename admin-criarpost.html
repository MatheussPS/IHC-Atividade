<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/admin-shared.css">
  <link rel="stylesheet" href="css/admin-criarpost.css">
  <title>Criar Post</title>
</head>

<body>
  <header class="header">
    <div class="header-content">
      <div class="logo-nav">
        <h1 class="logo-text">
          <a href="/">HABIT</a>
        </h1>

        <nav>
          <ul class="nav-ul">
            <li><a href="index.html">Início</a></li>
            <li><a href="categorias.html">Páginas</a></li>
            <li><a href="destaques.html">Destaques</a></li>
            <li><a href="newsletter.html">Assinar</a></li>
            <li><a href="#" class="selected">Admin</a></li>
          </ul>
        </nav>
      </div>

      <div class="actions-container">
        <form>
          <input id="search-input" type="text" class="header-search-input" placeholder="Buscar..."
            aria-label="Buscar" />
        </form>

        <button class="header-btn search-btn">Buscar</button>
        <button class="header-btn login-btn">Entrar</button>
      </div>
      <button class="menu-btn">
        <img class="hambuguer-img" src="img/hamburguer.png" alt="Imagem do menu" />
      </button>
    </div>
  </header>

  <main>
    <section id="dashboard">
      <aside>
        <h3 class="aside-title title">Menu</h3>
        <nav>
          <ul>
            <li><a href="admin-categoria.html">Categorias</a></li>
            <li><a href="#" class="selected">Criar Post</a></li>
            <li><a href="admin-escolhas-editor.html">Escolhas do Editor</a></li>
            <li><a href="admin-usuarios.html">Usuários</a></li>
            <li><a href="admin-fila-revisao.html">Fila de revisão</a></li>
            <li><a href="admin-fila-comentrarios.html">Fila de comentários</a></li>
          </ul>
        </nav>
      </aside>
      <div class="dashboard-content">
        <div class="statistics">
          <div class="card-statistics">
            <p class="card-title">Posts</p>
            <p class="desc-card">128</p>
          </div>
          <div class="card-statistics">
            <p class="card-title">Visualizações</p>
            <p class="desc-card">54k</p>
          </div>
          <div class="card-statistics">
            <p class="card-title">Inscritos</p>
            <p class="desc-card">12k</p>
          </div>
          <div class="card-statistics">
            <p class="card-title">Pendências</p>
            <p class="desc-card">7</p>
          </div>
        </div>
        <div class="post">
          <h2 class="post-title">Criar Post</h2>
          <div class="post-editor">
            <form class="post-form">
              <input type="text" class="titulo-input" placeholder="Título" aria-label="Título do post" />
              <textarea class="post-textarea" placeholder="Escreva aqui... (Editor simulador)"
                aria-label="Conteúdo do post"></textarea>
              <div class="tags-upload-container">
                <input type="text" class="tags-input" placeholder="Categorias e tags" aria-label="Categorias e tags" />
                <button class="upload-btn">Upload da imagem de capa</button>
              </div>
            </form>
            <div class="post-actions">
              <button class="post-btn post-btn--outline save-btn">Salvar rascunho</button>
              <button class="post-btn post-btn--outline send-btn">Enviar para revisão</button>
              <button class="post-btn post-btn--solid publish-btn">Publicar (admin)</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="botoes-footer">
      <button class="button-footer"><b>Instagram</b></button>
      <button class="button-footer"><b>Work</b></button>
      <button class="button-footer"><b>Bags</b></button>
      <button class="button-footer"><b>Lamp</b></button>
      <button class="button-footer"><b>Books</b></button>
    </div>
    <br />
    <p>© 2025 Meu Site • Meu site</p>
  </footer>
</body>

</html>
